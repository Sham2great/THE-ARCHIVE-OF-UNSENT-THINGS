<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>ANYONE CAN FIND LOVE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
:root{--bg:#050405;--panel:#101013;--line:#29292f;--muted:#777780;--text:#e9e8e8;--red:#ff334f;--soft:#b6b3b8;--green:#9bb8a5}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:14px}
button{font:inherit;cursor:pointer}button:focus-visible{outline:1px solid var(--red);outline-offset:4px}::selection{background:#853b45;color:white}
#shell{min-height:100vh;max-width:1200px;margin:auto;padding:0 34px 28px}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;color:#9a999f}
.brand{color:#eee;letter-spacing:.16em}.brand span{color:var(--red)}#status{display:flex;align-items:center;gap:9px}.led{height:6px;width:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #9bb8a566}#status.offline .led{background:var(--red);box-shadow:0 0 10px #e45c6955}
main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:36px;padding-top:42px;min-height:calc(100vh - 125px)}
#content{max-width:700px;width:100%;padding:0 0 45px;align-self:start}
#side{border-left:1px solid var(--line);padding:0 0 0 20px;font-family:'DM Mono',monospace;align-self:stretch}
.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:.16em;color:var(--red);text-transform:uppercase;margin-bottom:20px}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(35px,6.2vw,72px);line-height:1.02;letter-spacing:-.075em;font-weight:500;max-width:680px;margin-bottom:26px}h1 .quiet{color:#69676e}h2{font-size:clamp(23px,3vw,34px);font-weight:500;letter-spacing:-.055em;line-height:1.15;margin-bottom:17px}h3{font-size:15px;font-weight:500;margin-bottom:8px}
.lede{font-size:15px;line-height:1.9;color:#a6a4ab;max-width:510px}.rule{height:1px;background:var(--line);margin:30px 0}
.primary,.secondary,.choice,.textbutton{border:1px solid #45444b;background:transparent;color:var(--text);padding:13px 16px;text-align:left;transition:border-color .2s,background .2s,color .2s;line-height:1.55}
.primary{background:#e45c69;color:#170d10;border-color:#e45c69;font-weight:600}.primary:hover{background:#f07883;border-color:#f07883}.secondary:hover,.choice:hover{border-color:#8a5960;background:#171114}.textbutton{border:0;padding:5px 0;color:#8b8990;font:10px 'DM Mono',monospace}.textbutton:hover{color:#fff}
.actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:28px}
.meta{font:10px 'DM Mono',monospace;color:#66656d;letter-spacing:.1em}
.question{font-size:19px;line-height:1.5;max-width:570px;margin-bottom:24px}
.options{display:grid;gap:9px;max-width:590px}.choice{display:flex;align-items:flex-start;gap:14px;padding:15px 16px;color:#c9c7cc}.key{font:10px 'DM Mono',monospace;color:#777;min-width:18px;padding-top:3px}.choice span:last-child{line-height:1.6}
.panel{border:1px solid var(--line);background:#0d0d10;padding:18px;margin:16px 0}.panelhead{font:9px 'DM Mono',monospace;color:#777;letter-spacing:.14em;margin-bottom:15px;display:flex;justify-content:space-between;gap:10px}.profile{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:13px;border:1px solid var(--line);padding:15px;margin-bottom:9px;cursor:pointer;transition:background .2s,border-color .2s}.profile:hover{background:#151115;border-color:#70444a}.avatar{height:42px;width:42px;border:1px solid #49444d;display:grid;place-items:center;color:#c9bfc9;font:13px 'DM Mono',monospace;background:linear-gradient(135deg,#29232d,#131116)}.profile p{font-size:12px;color:#8b8990;margin:5px 0 0;line-height:1.5}.profile .arrow{color:#777;font-size:18px}.tag{font:9px 'DM Mono',monospace;color:#96919a;border:1px solid #343139;padding:5px 7px;white-space:nowrap}
.logline{font:10px/1.9 'DM Mono',monospace;color:#686771;overflow-wrap:anywhere}.logline.alert{color:var(--red)}.logline.ok{color:var(--green)}.logline.active{color:#c6c2ca}
#side h3{font:10px 'DM Mono',monospace;letter-spacing:.12em;color:#aaa;margin:0 0 15px}#side section{margin-bottom:32px}.sidecopy{font:11px/1.9 'DM Mono',monospace;color:#696871}.counter{font-size:22px;letter-spacing:-.04em;color:#dedbe1;margin-bottom:3px}.sidefoot{position:sticky;top:25px}
#trace{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.traceitem{font:10px/1.8 'DM Mono',monospace;color:#777;margin:7px 0}.traceitem:before{content:'+';color:var(--red);margin-right:9px}
#notice{position:fixed;bottom:20px;left:50%;transform:translate(-50%,12px);background:#171115;border:1px solid #684047;padding:12px 16px;font:11px 'DM Mono',monospace;color:#e5cdd0;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:calc(100vw - 32px);text-align:center}#notice.show{opacity:1;transform:translate(-50%,0)}
.glitch{animation:glitch .24s steps(2,end) 2}@keyframes glitch{0%{transform:translateX(0);text-shadow:none}25%{transform:translateX(3px);color:#ff334f;text-shadow:-3px 0 #7b101d,3px 0 #fff}50%{transform:translateX(-2px);filter:contrast(1.5)}100%{transform:translateX(0);text-shadow:none}}
body.hunted #status .led{animation:heartbeat 1.1s infinite}@keyframes heartbeat{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.5);box-shadow:0 0 15px #ff334f}}
body.hunted #statusText{color:var(--red)}
#trace .traceitem{transition:color .3s}body.hunted #trace .traceitem{color:#b86b75}
.fade{animation:appear .45s ease both}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
#footer{border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:12px;color:#5e5d65;font:9px 'DM Mono',monospace;letter-spacing:.08em}
.red{color:var(--red)}.muted{color:var(--muted)}.quote{font-size:clamp(20px,3vw,29px);line-height:1.55;letter-spacing:-.04em;color:#e7e4e8;max-width:570px}.evidence{border-top:1px solid var(--line);padding:17px 0}.evidence p{color:#96939b;line-height:1.8;margin:8px 0 0}.evidence .meta{margin-bottom:8px}
#endline{font-size:clamp(32px,6vw,68px);font-weight:500;letter-spacing:-.075em;line-height:1.15;margin:20px 0 8px}#exception{color:var(--red);opacity:0;filter:blur(5px);transform:translateY(5px);transition:all .9s}#exception.reveal{opacity:1;filter:blur(0);transform:none}
@media(max-width:800px){#shell{padding:0 19px 20px}main{grid-template-columns:1fr;gap:30px;padding-top:31px}#side{border-left:0;border-top:1px solid var(--line);padding:22px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:20px}#side section{margin:0}#trace{grid-column:1/-1}#content{padding-bottom:15px}.sidefoot{position:static}}
@media(max-width:480px){#shell{padding:0 15px 18px}header{height:58px;font-size:9px}main{padding-top:26px}h1{font-size:clamp(36px,12vw,56px)}.lede{font-size:14px}.profile{grid-template-columns:38px 1fr;gap:10px;padding:12px}.profile .tag{grid-column:2;justify-self:start}.profile .arrow{display:none}#side{grid-template-columns:1fr}.panel{padding:14px}.actions{gap:14px}.primary,.secondary{padding:12px 13px}#footer{font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="shell">
<header><div class="brand">AFCL<span>.</span> / EXPERIMENT 01</div><div id="status"><i class="led"></i><span id="statusText">SYSTEM NORMAL</span></div></header>
<main>
<div id="content" aria-live="polite"></div>
<aside id="side">
<div class="sidefoot">
<section><h3>SESSION STATUS</h3><div class="counter" id="stepcount">00 / 04</div><div class="sidecopy" id="sessioncopy">No profile created.<br>No data leaves this page.</div></section>
<section><h3>SYSTEM LOG</h3><div id="logs"><div class="logline ok">09:12:00 // service started</div><div class="logline">09:12:01 // waiting for participant</div></div></section>
<section id="trace"><h3>YOUR TRACE</h3><div id="traces" class="sidecopy">Nothing recorded yet.</div></section>
</div>
</aside>
</main>
<div id="footer"><span>ANYONE CAN FIND LOVE</span><span>LOCAL SESSION ONLY / NO ACCOUNT REQUIRED</span></div>
</div>
<div id="notice"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const content=$('content');
let answers=[],clues=[],profileChecks=0,ending='quiet',noticeTimer,questionIndex=0,evilLevel=0;
const questions=[
{eyebrow:'01 / PATTERN RECOGNITION',q:'Someone you care about starts replying differently. What do you do?',options:[['A','Ask if something changed.'],['B','Give them space and wait.'],['C','Read the conversation again for clues.']]},
{eyebrow:'02 / MATCHING CRITERIA',q:'Which feels harder to accept?',options:[['A','Someone never choosing you.'],['B','Never knowing why they left.'],['C','Being remembered incorrectly.']]},
{eyebrow:'03 / FINAL CALIBRATION',q:'If the truth would hurt, would you still want to know it?',options:[['A','Yes. Tell me everything.'],['B','Only if it changes something.'],['C','I would look, even if I said no.']]}
];
const logs=[
'09:12:00 // service started',
'09:12:01 // waiting for participant'
];
function log(s,type){const el=document.createElement('div');el.className='logline '+(type||'');el.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})+' // '+s;$('logs').appendChild(el);while($('logs').children.length>5)$('logs').removeChild($('logs').firstChild)}
function toast(s){$('notice').textContent=s;$('notice').classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove('show'),1900)}
function render(html){content.innerHTML=html;content.classList.remove('fade');void content.offsetWidth;content.classList.add('fade');window.scrollTo({top:0,behavior:'smooth'})}
function trace(s){clues.push(s);$('traces').innerHTML=clues.map(x=>'<div class="traceitem">'+x+'</div>').join('');}
function haunt(line){evilLevel++;document.body.classList.add('hunted');log(line,'alert');if(evilLevel>=2){const s=document.querySelector('#statusText');if(s){const old=s.textContent;s.textContent='WE SEE THE PATTERN';setTimeout(()=>{if(s&&s.textContent==='WE SEE THE PATTERN')s.textContent=old},1700)}}}
function status(s,off){$('statusText').textContent=s;$('status').classList.toggle('offline',!!off)}
function step(n){$('stepcount').textContent=String(n).padStart(2,'0')+' / 04'}
function home(){answers=[];clues=[];profileChecks=0;questionIndex=0;$('traces').textContent='Nothing recorded yet.';$('sessioncopy').innerHTML='No profile created.<br>No data leaves this page.';step(0);status('SYSTEM NORMAL');render('<div class="eyebrow">A SMALL EXPERIMENT IN HUMAN CONNECTION</div><h1>ANYONE CAN<br>FIND <span class="quiet">LOVE.</span></h1><p class="lede">A simple matching service. Three questions. A few people you might like. Nothing to lose except the part of you that keeps hoping.</p><div class="rule"></div><p class="meta">BEFORE YOU BEGIN</p><p class="lede" style="font-size:13px">This is a fictional interactive story. Your choices stay in this browser session. The system only reacts to answers you give it here.</p><div class="actions"><button class="primary" id="begin">BEGIN EXPERIMENT ↗</button><button class="textbutton" id="why">WHAT IS THIS?</button></div><p class="meta" style="margin-top:32px">NO ACCOUNT. NO PROFILE PHOTO. NO WAY TO APPEAL.</p>');$('begin').onclick=()=>{log('participant entered experiment','ok');questionIndex=0;ask()};$('why').onclick=()=>{render('<div class="eyebrow">ABOUT THIS EXPERIENCE</div><h2>Nothing here can read your mind.</h2><p class="lede">The website is a scripted psychological horror story. It uses only the choices you make during this session to shape the fiction. The unsettling part is what those choices seem to mean inside the story.</p><div class="actions"><button class="secondary" id="back">GO BACK</button><button class="primary" id="begin2">I UNDERSTAND ↗</button></div>');$('back').onclick=home;$('begin2').onclick=()=>{log('participant entered experiment','ok');ask()}}}
function ask(){const q=questions[questionIndex];step(1);$('sessioncopy').innerHTML='Calibration in progress.<br>Answer '+(questionIndex+1)+' of 3.';render('<div class="eyebrow">'+q.eyebrow+'</div><h2>'+q.q+'</h2><p class="lede" style="font-size:13px;margin-bottom:25px">There are no right answers. The service says this helps it find your best match.</p><div class="options">'+q.options.map(o=>'<button class="choice" data-answer="'+o[0]+'"><span class="key">'+o[0]+'</span><span>'+o[1]+'</span></button>').join('')+'</div><p class="meta" style="margin-top:25px">QUESTION '+(questionIndex+1)+' / 3</p>');content.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer))}
function choose(a){answers.push(a);log('response '+(questionIndex+1)+' recorded');trace('RESPONSE '+(questionIndex+1)+': '+a+' / stored locally');if(questionIndex===1){haunt('response pattern resembles prior failed sessions');toast('That answer is familiar.')}questionIndex++;if(questionIndex<questions.length){if(questionIndex===2){status('CALIBRATING');log('calibration took longer than expected','alert')}ask()}else matches()}
function matches(){step(2);$('sessioncopy').innerHTML='Profile generated.<br>3 possible matches.';status('MATCHES FOUND');log('3 compatible profiles returned','ok');render('<div class="eyebrow">04 / RESULTS GENERATED</div><h2>Three people. One of them might be your person.</h2><p class="lede" style="font-size:13px">Open a profile to see why the service thinks you would get along.</p><div class="panel"><div class="panelhead"><span>COMPATIBILITY REPORT</span><span>3 RESULTS</span></div><div class="profile" role="button" tabindex="0" data-profile="0"><div class="avatar">M.</div><div><h3>Morgan, 18</h3><p>Likes late-night conversations. Tends to overthink the last message.</p></div><span class="tag">92%</span><span class="arrow">↗</span></div><div class="profile" role="button" tabindex="0" data-profile="1"><div class="avatar">R.</div><div><h3>Riley, 19</h3><p>Wants someone honest. Has a complicated history with goodbyes.</p></div><span class="tag">87%</span><span class="arrow">↗</span></div><div class="profile" role="button" tabindex="0" data-profile="2"><div class="avatar">J.</div><div><h3>Jordan, 18</h3><p>Believes people deserve a second chance. Usually gives five.</p></div><span class="tag">84%</span><span class="arrow">↗</span></div></div><p class="meta">SELECT A PROFILE TO CONTINUE</p>');content.querySelectorAll('[data-profile]').forEach(el=>{el.onclick=()=>profile(Number(el.dataset.profile));el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();profile(Number(el.dataset.profile))}}})}
const profiles=[
{n:'Morgan',lines:['Their profile is unusually specific.','They wrote: “I can tell when someone is about to leave.”','The service marked this as a compatibility strength.'],last:'PROFILE NOTE: THIS DETAIL WAS NOT IN THE PUBLIC BIO.'},
{n:'Riley',lines:['Their account is still active.','Their status says: “Finally found my person.”','The photo is missing, but the status keeps updating.'],last:'LAST UPDATED: JUST NOW.'},
{n:'Jordan',lines:['Their profile says they believe in second chances.','The service has listed them as unavailable.','You have not opened their profile before.'],last:'STATUS: CHOSE SOMEONE ELSE.'}
];
function profile(i){profileChecks++;const p=profiles[i];log('profile '+p.n+' opened');trace('PROFILE OPENED: '+p.n.toUpperCase());if(profileChecks===2){status('RECHECKING RESULTS',true);haunt('match list changed while open');toast('It changed after you looked.')}else if(profileChecks>=3){haunt('participant continues despite warning');}render('<div class="eyebrow">PROFILE / '+p.n.toUpperCase()+'</div><h2>'+p.n+'</h2><p class="quote">“'+(i===0?'I can tell when someone is about to leave.':i===1?'Finally found my person.':'People deserve a second chance.')+'”</p><div class="rule"></div>'+p.lines.map((x,j)=>'<div class="evidence"><div class="meta">OBSERVATION 0'+(j+1)+'</div><p>'+x+'</p></div>').join('')+'<div class="panel"><div class="panelhead"><span>SERVICE DIAGNOSTIC</span><span class="red">NOTICE</span></div><p style="font:11px/1.9 DM Mono,monospace;color:#b9aeb7;margin:0">'+p.last+'</p></div><div class="actions"><button class="secondary" id="backmatches">BACK TO RESULTS</button><button class="primary" id="report">REPORT AN ISSUE ↗</button></div>');$('backmatches').onclick=matches;$('report').onclick=anomaly}
function anomaly(){step(3);status('INCONSISTENT DATA',true);log('integrity check failed','alert');trace('SYSTEM CONTRADICTION DETECTED');render('<div class="eyebrow">SYSTEM NOTICE / 0x04</div><h2>Something is wrong with these results.</h2><p class="lede">You report the profiles as inconsistent. The service runs a check, then returns a message that does not belong in a matching report.</p><div class="panel"><div class="panelhead"><span>INTERNAL MATCHING LOG</span><span class="red">UNEXPECTED OUTPUT</span></div><div class="logline">> PROFILE INDEX: 3</div><div class="logline">> AVAILABLE MATCHES: 0</div><div class="logline">> REASON: ALL CANDIDATES HAVE SELECTED SOMEONE</div><div class="logline alert">> EXCEPTION: PARTICIPANT HAS NOT BEEN SELECTED</div><div class="logline">> RETRYING...</div><div class="logline alert">> RETRYING...</div><div class="logline alert">> RETRYING...</div></div><p class="lede" style="font-size:13px">You did not enter a name. You did not upload a photo. Somehow, the report has a field for you.</p><div class="actions"><button class="primary" id="inspect">INSPECT THE EVIDENCE</button><button class="secondary" id="confront">ASK WHY</button></div>');$('inspect').onclick=evidence;$('confront').onclick=confront}
function evidence(){log('participant inspected local evidence');trace('EVIDENCE INSPECTED');render('<div class="eyebrow">CASE FILE / GENERATED DURING THIS SESSION</div><h2>The evidence does not agree with the explanation.</h2><div class="evidence"><div class="meta">FILE 01 / YOUR ANSWERS</div><p>The service stored three responses. It did not need a name to assign a pattern to them.</p></div><div class="evidence"><div class="meta">FILE 02 / MATCH HISTORY</div><p>Every profile became unavailable after you opened it. The service calls this a normal result.</p></div><div class="evidence"><div class="meta">FILE 03 / UNRESOLVED FIELD</div><p>“Participant has not been selected.” The report treats being chosen as a condition you failed, not a decision another person made.</p></div><div class="panel"><p class="quote" style="font-size:20px;margin:0">The system can explain why everyone else found someone.</p><p style="color:#ff334f;line-height:1.8;margin:12px 0 0">It can explain why you keep coming back. It will never call it hope.</p></div><div class="actions"><button class="primary" id="final">REQUEST FINAL RESULT ↗</button><button class="secondary" id="backbug">BACK</button></div>');$('final').onclick=finale;$('backbug').onclick=anomaly}
function confront(){log('participant requested explanation','alert');trace('EXPLANATION REQUESTED');render('<div class="eyebrow">SUPPORT / AUTOMATED RESPONSE</div><h2>Thank you for your patience.</h2><div class="panel"><div class="panelhead"><span>SUPPORT BOT</span><span>JUST NOW</span></div><p style="line-height:1.9;color:#c5bec8">We understand how difficult uncertainty can be. Uncertainty increases engagement by 41%.</p><p style="line-height:1.9;color:#ff334f;margin:0">Your result is not an error. Your result is the reason the experiment works.</p></div><p class="lede" style="font-size:13px">The response ends. A typing indicator continues for a few seconds.</p><div class="actions"><button class="primary" id="final">REQUEST FINAL RESULT ↗</button><button class="secondary" id="evidence">VIEW EVIDENCE</button></div>');$('final').onclick=finale;$('evidence').onclick=evidence;setTimeout(()=>{if($('content').querySelector('#final'))toast('Support is no longer responding.')},2500)}
function finale(){ending=answers[0]==='C'?'evidence':answers[1]==='B'?'uncertainty':'quiet';status('SESSION COMPLETE',true);log('final result issued','alert');step(4);render('<div class="eyebrow">FINAL RESULT / SESSION CLOSED</div><div class="meta">MATCHMAKING REPORT: COMPLETE</div><div id="endline">ANYONE CAN<br>FIND LOVE<span id="exception"><br>(EXCEPT YOU)</span></div><div class="rule"></div><p class="lede" id="endingcopy"></p><div class="actions"><button class="primary" id="again">RUN THE EXPERIMENT AGAIN ↻</button><button class="secondary" id="leave">LEAVE THIS PAGE</button></div><p class="meta" style="margin-top:35px">THIS IS A FICTIONAL RESULT. IT DOES NOT DESCRIBE YOUR REAL LIFE.</p>');let copy=ending==='evidence'?'You found the lie underneath the interface. The system did not need to stop you. You kept choosing to look.':ending==='uncertainty'?'You asked it to explain the cruelty. It answered with a number. That is what it was built to do.':'You followed every instruction because a part of you believed the right answer would finally make you chosen. The system was designed around that part.';$('endingcopy').textContent=copy;setTimeout(()=>$('exception').classList.add('reveal'),1250);$('again').onclick=()=>{status('SYSTEM NORMAL');log('new session initialized','ok');home()};$('leave').onclick=()=>{render('<div class="eyebrow">SESSION CLOSED</div><h2>You can leave whenever you want.</h2><p class="lede">The story ends when you close it. The part that hurt was never inside the computer.</p><div class="actions"><button class="secondary" id="return">RETURN TO START</button></div>');$('return').onclick=home}}
home();
})();
</script>
</body>
</html>
